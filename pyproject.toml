# Tool configuration only; this project is not packaged.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["old_code", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Catalogue tables keep one input per line so they read like a spec sheet.
"simulation_engine/catalog.py" = ["E501"]
